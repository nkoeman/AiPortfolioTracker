services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:-/}
        NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:-/}
    restart: unless-stopped
    environment:
      # Base/prod-safe: DATABASE_URL comes from environment (managed DB in production).
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:-/}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:-/}
      PRISMA_CLI_QUERY_ENGINE_TYPE: binary
      EODHD_API_KEY: ${EODHD_API_KEY:-}
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      BENCHMARK_SP500_ENABLED: ${BENCHMARK_SP500_ENABLED:-false}
      BENCHMARK_SP500_LABEL: ${BENCHMARK_SP500_LABEL:-S&P 500}
      BENCHMARK_SP500_PROVIDER: ${BENCHMARK_SP500_PROVIDER:-eodhd}
      BENCHMARK_SP500_SYMBOL: ${BENCHMARK_SP500_SYMBOL:-VUAA.XETRA}
      BENCHMARK_SP500_ISIN: ${BENCHMARK_SP500_ISIN:-IE00BFMXXD54}
      BENCHMARK_SP500_CURRENCY: ${BENCHMARK_SP500_CURRENCY:-EUR}
      BENCHMARK_FTSE_ALL_WORLD_ENABLED: ${BENCHMARK_FTSE_ALL_WORLD_ENABLED:-false}
      BENCHMARK_FTSE_ALL_WORLD_LABEL: ${BENCHMARK_FTSE_ALL_WORLD_LABEL:-FTSE All-World}
      BENCHMARK_FTSE_ALL_WORLD_PROVIDER: ${BENCHMARK_FTSE_ALL_WORLD_PROVIDER:-eodhd}
      BENCHMARK_FTSE_ALL_WORLD_SYMBOL: ${BENCHMARK_FTSE_ALL_WORLD_SYMBOL:-VWCE.XETRA}
      BENCHMARK_FTSE_ALL_WORLD_ISIN: ${BENCHMARK_FTSE_ALL_WORLD_ISIN:-IE00BK5BQT80}
      BENCHMARK_FTSE_ALL_WORLD_CURRENCY: ${BENCHMARK_FTSE_ALL_WORLD_CURRENCY:-EUR}
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
